<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Intégrate con el SII con SII SDK de Devlas">
  <defs>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 64 L28 97 M0 48 L0 81 M56 48 L56 81" fill="none" stroke="#1b2a38" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%">
      <stop offset="0" stop-color="#1fb6d6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1fb6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sii" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="#080c11"/>
  <rect width="1200" height="460" fill="url(#hex)" opacity="0.8"/>
  <rect width="1200" height="460" fill="url(#glow)"/>

  <g transform="translate(64 40)">
    <path d="M18 0 L36 10 L36 30 L18 40 L0 30 L0 10 Z" fill="none" stroke="url(#borde)" stroke-width="3"/>
    <path d="M10 15 L18 11 L26 15 M10 21 L18 17 L26 21 M10 27 L18 23 L26 27" fill="none" stroke="#4cc9f0" stroke-width="2.4" stroke-linecap="round"/>
    <text x="50" y="28" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">SII SDK</text>
    <text x="150" y="28" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#7c8da0">por Devlas</text>
  </g>
  <g transform="translate(1000 40)">
    <rect width="136" height="40" rx="10" fill="#4cc9f0"/>
    <text x="68" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#06202a">sii.devlas.cl</text>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2" fill="#f8fafc">Intégrate con el <tspan fill="url(#sii)">SII</tspan></text>
  <text x="600" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9fb0c3">Facturación electrónica para Chile en una librería TypeScript.</text>

  <!-- conexiones -->
  <g stroke="#2b4a63" stroke-width="1.6" fill="none">
    <path d="M300 330 L500 330"/>
    <path d="M700 330 C780 330 800 262 860 262"/>
    <path d="M700 330 C780 330 800 304 860 304"/>
    <path d="M700 330 C780 330 800 350 860 350"/>
    <path d="M700 330 C780 330 800 392 860 392"/>
  </g>
  <circle cx="340" cy="330" r="5" fill="#f5b83d"/><circle cx="420" cy="330" r="5" fill="#4cc9f0"/>
  <circle cx="770" cy="296" r="5" fill="#f5b83d"/><circle cx="790" cy="336" r="5" fill="#4cc9f0"/><circle cx="780" cy="372" r="5" fill="#34d399"/>

  <!-- tu sistema -->
  <g transform="translate(120 262)">
    <rect width="180" height="136" rx="16" fill="#0e151d" stroke="#223244"/>
    <rect x="30" y="18" width="120" height="58" rx="8" fill="#0b1118" stroke="#3a566f" stroke-width="2"/>
    <rect x="40" y="30" width="22" height="5" rx="2.5" fill="#4cc9f0"/><rect x="72" y="30" width="68" height="5" rx="2.5" fill="#5b7288"/>
    <rect x="72" y="42" width="52" height="5" rx="2.5" fill="#3a566f"/><rect x="108" y="58" width="32" height="8" rx="4" fill="#34d399"/>
    <text x="90" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9">Tu sistema</text>
    <text x="90" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8da0b4">POS, ERP o SaaS</text>
  </g>

  <!-- hexagono -->
  <g transform="translate(600 330)">
    <path d="M0 -86 L74 -43 L74 43 L0 86 L-74 43 L-74 -43 Z" fill="#0b1219" stroke="url(#borde)" stroke-width="4"/>
    <path d="M0 -70 L60 -35 L60 35 L0 70 L-60 35 L-60 -35 Z" fill="none" stroke="#1d3a4f" stroke-width="1.5"/>
    <path d="M-16 -22 L0 -30 L16 -22 M-16 -12 L0 -20 L16 -12 M-16 -2 L0 -10 L16 -2" fill="none" stroke="#4cc9f0" stroke-width="3.4" stroke-linecap="round"/>
    <text y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">SII SDK</text>
    <g transform="translate(58 -66) rotate(10)"><rect width="52" height="52" rx="10" fill="#3178c6" stroke="#dbeafe" stroke-width="2"/><text x="26" y="35" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">TS</text></g>
    <g transform="translate(-92 44) rotate(-12)"><path d="M26 0 L52 14 L52 40 L26 54 L0 40 L0 14 Z" fill="#5fa04e" stroke="#e6f4e1" stroke-width="2"/><text x="26" y="33" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff">node</text></g>
  </g>
  <text x="600" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4" fill="#7c8da0">EN TU SERVIDOR</text>

  <!-- SII -->
  <g transform="translate(860 222)">
    <rect width="250" height="196" rx="18" fill="#0e151d" stroke="#223244"/>
    <text x="22" y="46" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#3b82f6">Sii</text>
    <circle cx="51" cy="14" r="4.6" fill="#f26b21"/><circle cx="62" cy="14" r="4.6" fill="#f26b21"/>
    <line x1="18" y1="62" x2="232" y2="62" stroke="#223244"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0">
      <circle cx="30" cy="86" r="5" fill="#f5b83d"/><text x="48" y="92">Folios CAF</text>
      <circle cx="30" cy="118" r="5" fill="#4cc9f0"/><text x="48" y="124">Recepción de DTE</text>
      <circle cx="30" cy="150" r="5" fill="#34d399"/><text x="48" y="156">Estado del envío</text>
      <circle cx="30" cy="182" r="5" fill="#a78bfa"/><text x="48" y="188">Certificación</text>
    </g>
  </g>
</svg>
