# Avisos de actualización de dependencias.
#
# Esta librería hace criptografía con node-forge, xml-crypto y xml-c14n. Una
# vulnerabilidad ahí no es cosmética: compromete la firma de documentos
# tributarios. Por eso conviene enterarse por aviso y no por casualidad.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Solo los parches se agrupan. Las menores y mayores llegan sueltas, una
      # por PR, porque cada una necesita mirarse.
      #
      # Antes el grupo incluía [minor, patch] y eso resultó estar mal: dos de
      # estas dependencias están en 0.x (@xmldom/xmldom y xml-c14n), y en 0.x la
      # convención es que el segundo número hace de mayor, o sea que 0.8 -> 0.9
      # puede romper igual que 1.x -> 2.x. Dependabot lo clasifica como "minor"
      # porque mira el dígito, no la convención.
      #
      # Con la regla vieja, un salto de @xmldom/xmldom 0.8 -> 0.9 viajó dentro de
      # un PR rotulado "menores" junto a un parche trivial (PR #8, 24/08/2026).
      # Esa librería es el parser de XML que usan Signer.js, DTE.js y la
      # canonicalización: está justo debajo de la firma de los documentos.
      parches:
        update-types: [patch]
    ignore:
      # got es solo ESM desde la v12 y esta librería es CommonJS, así que
      # cualquier major rompe el `require('got')` de SiiSession.js con
      # ERR_REQUIRE_ESM y la librería deja de cargar por completo.
      #
      # Verificado el 24/08/2026 en el PR #9 (got 11.8.6 -> 15.1.0): el CI lo
      # detuvo en el paso "Cargar la librería", primero en Node 18, donde el
      # require de ESM falla más duro que en 20 y 22.
      #
      # Subir de acá exige migrar a `import()` dinámico o cambiar de cliente
      # HTTP. Es un proyecto en sí mismo, no un bump. Mientras tanto los
      # parches y menores de la 11.x sí entran.
      - dependency-name: got
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
