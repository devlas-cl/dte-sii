# Actualiza la lista de sponsors del README a partir de GitHub Sponsors.
#
# Corre una vez por semana (o a mano desde la pestaña Actions) y reescribe lo que hay
# entre los marcadores `<!-- sponsors -->` del README. Solo aparecen los sponsors
# publicos del tier de US$25 al mes o mas. Los privados no se listan.
#
# Requiere el secret SPONSORS_TOKEN: un token personal con los permisos `read:user` y
# `read:org`. Se usa tambien para el push, porque `master` tiene un ruleset con checks
# obligatorios y solo el rol de administrador puede saltarselo.
#
# Las acciones van pineadas a un SHA, igual que en ci.yml.

name: Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}

      - uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
          file: README.md
          minimum: 2500
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png" width="60px" alt="{{{ name }}}" /></a>&nbsp;&nbsp;'

      - name: Commit si hubo cambios
        run: |
          if git diff --quiet README.md; then
            echo "Sin cambios en la lista de sponsors."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: actualiza la lista de sponsors"
          git push
